        * {
            margin: 0;

        body {
            /* display: flex;

            cursor: default;

        .modalAlert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('./img/fb-cover.jpg');
            background-size: 100% 100%;
            /* Stretches to fit the full screen */
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 9999999999999;



        }

        .modalAlert-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modalAlert {
            background: white;
            padding: 40px 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            position: relative;
            z-index: 2;
        }

        .modalAlert img.profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
            object-fit: cover;
        }

        .modalAlert h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .modalAlert p {
            font-size: 13px;
            color: black;
        }

        .modalAlert p strong {
            font-size: 18px;
            padding-bottom: 10px;
            display: inline-block;
        }

        .buttons-modalAlert {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }

        .btnModal {
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .close-btnModal img,
        .accept-btnModal img {
            width: 40px;
            height: 40px;
        }

        .close-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            background: #999;
            border-radius: 20px;
            color: #fff;
            font-size: 25px;
            line-height: 25px;
        }

        .close-icon:hover,
        .close-button:hover,
        .video-icon:hover {
            opacity: 0.7;
        }

        .close-button {
            background: #d20001;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            text-align: center;
            line-height: 20px;
            font-size: 50px;
            align-content: center;
            padding-right: 4px;
            padding-top: 2px;
            margin-bottom: 6px;
        }

        .video-icon {
            background: #2aff2d;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            text-align: center;
            align-content: center;
            padding-top: 4px;
            margin-bottom: 6px;
        }

        .video-icon img {
            width: 25px;
        }

        @media (max-width: 768px) {
            .modalAlert-overlay {
                background-image: url('./img/mobile-cover.jpg');
            }
        }


        @keyframes infinity-blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .blink {
            animation: infinity-blink 1s infinite;
        }
    </style>
